<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>En direct</title>
<style>
  :root { --bg:#0d0d10; --card:#1a1a1f; --border:#2a2a30; --fg:#eee; --dim:#9a9aa2; --ok:#57f287; --bad:#ed4245; --warn:#f0b232; --accent:#5865f2; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, "Segoe UI", sans-serif; }
  body { padding: 1rem 1.2rem 2rem; }
  h2 { margin: 0 0 .6rem; font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); font-weight: 600; }
  .hero { display: flex; align-items: center; gap: 1rem; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1.1rem 1.3rem; margin-bottom: 1rem; }
  .badge { font-size: .75rem; font-weight: 700; letter-spacing: .08em; padding: .3rem .7rem; border-radius: 999px; background: #2a2a30; color: var(--dim); }
  .badge.live { background: var(--bad); color: #fff; }
  .hero .who { font-size: 1.15rem; font-weight: 600; }
  .hero .sub { color: var(--dim); font-size: .85rem; margin-top: .15rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr)); gap: 1rem; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1rem 1.1rem; min-width: 0; }
  .kv { display: flex; justify-content: space-between; gap: 1rem; padding: .25rem 0; font-size: .9rem; }
  .kv span:first-child { color: var(--dim); }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
  .scenes { display: flex; flex-wrap: wrap; gap: .4rem; }
  .scene { font-size: .8rem; border: 1px solid var(--border); border-radius: 8px; padding: .25rem .6rem; color: var(--dim); }
  .scene.cur { border-color: var(--accent); color: var(--fg); background: #5865f222; }
  .chat { max-height: 18rem; overflow-y: auto; font-size: .88rem; line-height: 1.4; }
  .chat div { padding: .15rem 0; overflow-wrap: anywhere; }
  .chat b { color: #9aa4ff; }
  .chat .mod b { color: var(--ok); }
  .empty { color: var(--dim); font-size: .85rem; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: .25rem 0; font-size: .88rem; display: flex; justify-content: space-between; gap: .8rem; }
  li span:last-child { color: var(--dim); white-space: nowrap; }
</style>
</head>
<body>
<div class="hero">
  <span class="badge" id="badge">HORS LIGNE</span>
  <div>
    <div class="who" id="who">Aucun stream en cours</div>
    <div class="sub" id="sub"></div>
  </div>
</div>

<div class="grid">
  <div class="card">
    <h2>Santé du stream</h2>
    <div id="health"></div>
  </div>
  <div class="card">
    <h2>Scènes OBS</h2>
    <div class="scenes" id="scenes"></div>
  </div>
  <div class="card">
    <h2>Chat Twitch</h2>
    <div class="chat" id="chat"></div>
  </div>
  <div class="card">
    <h2>Clips récents</h2>
    <ul id="clips"></ul>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const pad = (n) => String(n).padStart(2, '0');
  const hhmm = (ms) => { const d = new Date(ms); return `${pad(d.getHours())}h${pad(d.getMinutes())}`; };
  const dur = (ms) => {
    const t = Math.max(0, Math.floor(ms / 1000));
    const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60);
    return h ? `${h} h ${pad(m)}` : `${m} min`;
  };
  const kv = (k, v, cls = '') => `<div class="kv"><span>${k}</span><span class="${cls}">${v}</span></div>`;

  function render(s) {
    const live = s.live;
    $('badge').textContent = live ? 'EN DIRECT' : 'HORS LIGNE';
    $('badge').className = 'badge' + (live ? ' live' : '');

    const who = s.streamer;
    if (who) {
      $('who').textContent = who.name ? `${who.name} est en direct` : 'Stream en cours sur ce PC';
      const parts = [];
      if (who.since) parts.push(`depuis ${hhmm(who.since)} (${dur(Date.now() - who.since)})`);
      parts.push(who.here ? 'diffusé depuis ce PC' : 'diffusé depuis un autre PC');
      if (s.viewers?.viewers != null) parts.push(`${s.viewers.viewers} spectateur${s.viewers.viewers > 1 ? 's' : ''}`);
      $('sub').textContent = parts.join(' · ');
    } else {
      $('who').textContent = 'Aucun stream en cours';
      $('sub').textContent = s.discord.lastEnd ? `Dernier stream terminé à ${hhmm(s.discord.lastEnd)}` : (s.discord.enabled && !s.discord.lockAvailable ? 'Verrou Discord indisponible (bot non connecté).' : '');
    }

    const h = s.obs.health;
    let health = kv('OBS', s.obs.connected ? 'connecté' : 'non connecté', s.obs.connected ? 'ok' : 'bad');
    if (s.obs.streaming && h) {
      const drop = h.totalFrames ? (100 * h.droppedFrames / h.totalFrames) : 0;
      health += kv('Durée', s.obs.durationMs != null ? dur(s.obs.durationMs) : '—');
      health += kv('Débit', h.bitrateKbps != null ? `${h.bitrateKbps} kb/s` : '…');
      health += kv('Images/s', h.fps);
      health += kv('CPU OBS', `${h.cpuPct} %`, h.cpuPct > 85 ? 'warn' : '');
      health += kv('Images perdues', `${drop.toFixed(1)} %`, drop > 2 ? 'bad' : drop > 0.5 ? 'warn' : 'ok');
    } else if (s.obs.connected) {
      health += kv('Diffusion', 'arrêtée', 'warn');
    }
    if (s.viewers?.chatters != null) health += kv('Connectés au chat', s.viewers.chatters);
    $('health').innerHTML = health;

    $('scenes').innerHTML = s.obs.scenes.length
      ? s.obs.scenes.map((n) => `<span class="scene${n === s.obs.scene ? ' cur' : ''}">${esc(n)}</span>`).join('')
      : '<span class="empty">Aucune scène (OBS non connecté).</span>';

    const chat = $('chat');
    const atBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 30;
    chat.innerHTML = s.chat.length
      ? s.chat.map((m) => `<div class="${m.mod ? 'mod' : ''}"><b>${esc(m.name)}</b> ${esc(m.text)}</div>`).join('')
      : '<span class="empty">Pas de message récent.</span>';
    if (atBottom) chat.scrollTop = chat.scrollHeight;

    $('clips').innerHTML = s.clips.length
      ? s.clips.map((c) => `<li><span>${esc(c.file)}</span><span>${hhmm(c.at)} · ${esc(c.source)}</span></li>`).join('')
      : '<span class="empty">Aucun clip publié depuis le lancement.</span>';
  }

  async function poll() {
    try {
      render(await (await fetch('/api/live', { cache: 'no-store' })).json());
    } catch {
      $('badge').textContent = 'SERVICE INDISPONIBLE';
      $('badge').className = 'badge';
    }
  }
  poll();
  setInterval(poll, 3000);
</script>
</body>
</html>
