<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session du dimanche</title>
<style>
  :root { --bg:#0d0d10; --card:#1a1a1f; --border:#2a2a30; --fg:#eee; --dim:#9a9aa2; --accent:#5865f2; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, "Segoe UI", sans-serif; user-select: none; }
  body { display: flex; flex-direction: column; justify-content: center; padding: 0 1.2rem; box-sizing: border-box; }
  p { margin: 0 0 .9rem; line-height: 1.4; text-align: center; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
  button { font: inherit; padding: .55rem .4rem; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--fg); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); font-weight: 600; grid-column: 1 / -1; }
  small { display: block; text-align: center; color: var(--dim); margin-top: .7rem; }
</style>
</head>
<body>
<p>Tu viens de rejoindre le vocal.<br><b>Lancer le stream ?</b></p>
<div class="row">
  <button class="primary" data-c="0">Lancer le stream</button>
  <button data-c="1">Juste ouvrir OBS</button>
  <button data-c="2">Non</button>
  <button data-c="3" style="grid-column:1/-1">Non, plus ce soir</button>
</div>
<small id="left"></small>
<script>
  let id = null, deadline = 0, sent = false;
  async function answer(c) {
    if (sent) return;
    sent = true;
    try { await fetch('/api/discord/confirm', { method: 'POST', body: JSON.stringify({ id, choice: c }) }); } catch { /* service indisponible */ }
    location.href = '/closed';
  }
  document.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => answer(Number(b.dataset.c))));
  // Fermer la fenêtre = « Non ».
  window.addEventListener('pagehide', () => { if (!sent && id) navigator.sendBeacon('/api/discord/confirm', JSON.stringify({ id, choice: 2 })); });
  async function poll() {
    try {
      const r = await (await fetch('/api/discord/confirm', { cache: 'no-store' })).json();
      if (!r.id) return location.href = '/closed';
      id = r.id; deadline = r.deadline;
    } catch { /* on réessaie */ }
  }
  poll();
  setInterval(() => {
    if (!deadline) return;
    const s = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
    document.getElementById('left').textContent = `Sans réponse dans ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}, ce sera « Non ».`;
    if (s === 0) setTimeout(poll, 1500);
  }, 500);
</script>
</body>
</html>
